<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../core/base.css" />
    <link rel="stylesheet" href="../../components/components.css" />
    <link rel="stylesheet" href="../../core/layout.css" />
    <link rel="stylesheet" href="schedules.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="flex-row">
      <aside id="sidebar"></aside>
      <div>
        <div id="header"></div>
        <div id="content">
          <div style="margin: 0px 0px 24px 0px">
            <h2
              class="large-text"
              style="font-weight: 600; margin: 0px 0px 8px 0px"
            >
              Horários de Uso das Salas
            </h2>
            <p class="light text no-margin">
              Visualize e gerencie a ocupação das salas
            </p>
          </div>
          <div
            class="flex-row big-bottom-margin"
            style="justify-content: space-between"
          >
            <div id="floor-filter"></div>
            <button id="new-reservation-button" class="base-button bold text">
              + Nova Reserva
            </button>
          </div>
          <div id="week-toggle"></div>
          <div id="room-selector"></div>
          <div id="schedule-grid"></div>
          <div id="schedule-resume" style="margin-top: 24px"></div>
        </div>
      </div>
    </div>

    <div id="modal-container"></div>

    <script src="../../components/icons.js"></script>
    <script src="../../components/header.js"></script>
    <script src="../../components/sidebar.js"></script>
    <script src="../../components/floor-filter.js"></script>

    <script src="../../services/floors-storage.js"></script>
    <script src="../../services/schedules-storage.js"></script>

    <script src="templates.js"></script>
    <script src="actions.js"></script>
    <script src="index.js"></script>
    <script>
      renderSidebar("schedules");
    </script>
  </body>
</html>
