<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../core/base.css" />
    <link rel="stylesheet" href="../../components/components.css" />
    <link rel="stylesheet" href="../../core/layout.css" />
    <link rel="stylesheet" href="loans.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="flex-row">
      <aside id="sidebar"></aside>
      <div>
        <div id="header"></div>
        <div id="content">
          <div
            class="flex-row big-bottom-margin"
            style="justify-content: space-between; align-items: center"
          >
            <div class="big-bottom-margin">
              <h2
                class="large-text small-bottom-margin"
                style="font-weight: 600"
              >
                Controle de Empréstimos
              </h2>
              <p class="light text no-margin">
                Gerencie os equipamentos emprestados
              </p>
            </div>
            <button id="new-loan-button" class="base-button bold text">
              + Novo Empréstimo
            </button>
          </div>
          <div id="loans-resume"></div>
          <div id="search-container"></div>
          <div id="loans-table"></div>
        </div>
      </div>
    </div>
    <div id="loan-modal" class="modal-overlay hidden">
      <div class="card modal-box" style="padding: 24px">
        <div
          class="flex-row medium-bottom-margin"
          style="justify-content: space-between; align-items: center"
        >
          <h3 class="bold big-text no-margin">Novo Empréstimo</h3>
          <button
            id="close-modal"
            type="button"
            class="base-button bold text"
            style="background-color: transparent"
          >
            ✕
          </button>
        </div>
        <form id="loan-form">
          <div class="small-bottom-margin">
            <label
              class="bold small-text small-bottom-margin"
              style="display: block"
              >Responsável</label
            >
            <input
              id="loan-responsible"
              placeholder="Responsável"
              class="modal-input"
              required
            />
          </div>
          <div class="small-bottom-margin">
            <label
              class="bold small-text small-bottom-margin"
              style="display: block"
              >Matrícula</label
            >
            <input
              id="loan-registration"
              placeholder="Matrícula"
              class="modal-input"
              required
            />
          </div>
          <div class="small-bottom-margin">
            <label
              class="bold small-text small-bottom-margin"
              style="display: block"
              >Item</label
            >
            <select id="loan-item" class="modal-input" required></select>
          </div>
          <div class="flex-row small-bottom-margin" style="gap: 12px">
            <div style="flex: 1">
              <label
                class="bold small-text small-bottom-margin"
                style="display: block"
                >Data Empréstimo</label
              >
              <input
                id="loan-loanDate"
                type="date"
                class="modal-input"
                required
              />
            </div>
            <div style="flex: 1">
              <label
                class="bold small-text small-bottom-margin"
                style="display: block"
                >Data Retorno</label
              >
              <input
                id="loan-returnDate"
                type="date"
                class="modal-input"
                required
              />
            </div>
          </div>
          <button
            type="submit"
            class="base-button bold text"
            style="
              background-color: #2d6a4f;
              color: #ffffff;
              width: 100%;
              padding: 10px;
            "
          >
            Confirmar Empréstimo
          </button>
        </form>
      </div>
    </div>
    <script src="../../components/icons.js"></script>
    <script src="../../components/header.js"></script>
    <script src="../../components/sidebar.js"></script>
    <script src="../../components/search-field.js"></script>
    <script src="../../services/loans-storage.js"></script>
    <script src="templates.js"></script>
    <script src="actions.js"></script>
    <script src="index.js"></script>
    <script src="modal.js"></script>
    <script>
      renderSidebar("loans");
      renderHeader();
    </script>
  </body>
</html>
