<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="core/base.css" />
    <link rel="stylesheet" href="components/components.css" />
    <link rel="stylesheet" href="pages/login/login.css" />
  </head>
  <body>
    <div class="content">
      <div class="bigger-bottom-margin content">
        <div id="login-logo" class="logo green-background">
          <svg id="login-logo-vec" class="logo-vec" viewBox="0 0 24 24">
            <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
            <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
            <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
            <path d="M10 6h4"></path>
            <path d="M10 10h4"></path>
            <path d="M10 14h4"></path>
            <path d="M10 18h4"></path>
          </svg>
        </div>
        <h1 id="title" class="larger-text">Campus Control</h1>
        <p class="light text no-margin centralized-text">
          Sistema Operacional Interno
        </p>
      </div>
      <div id="login-card" class="card bigger-bottom-margin shadow">
        <div id="access-text">
          <h2 class="bigger-text">Acesso ao Sistema</h2>
          <p id="access-subtitle" class="small-text light">
            Digite suas credenciais para continuar
          </p>
        </div>
        <div class="form">
          <div>
            <label for="matricula" class="small-text">Matrícula</label>
            <div class="input-wrapper">
              <svg class="icon-vec icon" viewBox="0 0 24 24">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                type="text"
                class="input text"
                id="matricula"
                placeholder="Digite sua matrícula"
              />
            </div>
          </div>
          <div>
            <label for="senha" class="small-text">Senha</label>
            <div class="input-wrapper">
              <svg class="icon-vec icon" viewBox="0 0 24 24">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input
                type="password"
                class="input text"
                id="senha"
                placeholder="Digite sua senha"
              />
            </div>
          </div>
        </div>
        <button id="forgot-password" class="text-button small-text">
          Esqueci minha senha
        </button>
        <button
          class="text"
          id="login-button"
          onclick="window.location.href = './pages/dashboard'"
        >
          Entrar no Sistema
        </button>
      </div>
      <div id="contact-support">
        <p class="light text no-margin">Problemas para acessar?</p>
        <button id="support-button" class="text-button text">
          Contate o suporte técnico
        </button>
      </div>
    </div>
  </body>
</html>
